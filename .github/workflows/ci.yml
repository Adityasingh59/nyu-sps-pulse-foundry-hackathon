name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # The optional @openai/codex CLI is a local provider dependency. CI never
      # calls a model, so it is omitted to keep installs fast and hermetic.
      - name: Install dependencies
        run: npm ci --omit=optional

      - name: Typecheck and build
        run: npm run build

      # Tests use temporary SQLite files and ephemeral ports. They make no
      # provider calls and never touch data/tablesignal.sqlite.
      - name: Run tests
        run: npm test

  guard:
    name: Guard against committed data and secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # data/ holds the real evidence database and raw provider answers. It is
      # gitignored on purpose; a commit that adds it should fail loudly.
      - name: Reject tracked database or environment files
        run: |
          tracked=$(git ls-files -- 'data/**' '*.sqlite' '*.sqlite-wal' '*.sqlite-shm' '.env' '.env.*' ':!.env.example')
          if [ -n "$tracked" ]; then
            echo "::error::These files must not be tracked:"
            echo "$tracked"
            exit 1
          fi
          echo "No database or environment files are tracked."

      - name: Scan for credential-shaped strings
        run: |
          if git grep -nIE '(sk-[A-Za-z0-9]{20,}|gh[pousr]_[A-Za-z0-9]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY)' \
               -- ':!.github/workflows/ci.yml'; then
            echo "::error::A credential-shaped string was found in tracked content."
            exit 1
          fi
          echo "No credential-shaped strings found."
