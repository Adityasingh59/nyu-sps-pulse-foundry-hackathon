version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      # One PR per ecosystem area keeps review cheap on a small team.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      build-tooling:
        patterns: ["vite", "@vitejs/*", "typescript", "tsx", "concurrently"]
    ignore:
      # No major bumps. The event is a fixed date and a breaking upgrade days
      # before it costs more than it returns. Revisit after October 23, 2026.
      # @openai/codex is additionally sensitive: its JSON event format is parsed
      # directly in server/codex-provider.ts.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
